:root{

h2{font-family:var(--display);font-size:18px;margin:6px 0 0;text-wrap:balance}

.court svg{width:100%;height:auto;display:block}

.list-btn small{color:var(--muted);font-size:12px}
.arrow{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px}
.sym-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;background:var(--surface);text-align:left;width:100%}
.sym-row b{font-size:14px}
.sym-row .c{font-size:13px;color:var(--muted)}

.back{border:0;background:none;color:var(--muted);padding:0;font-size:13px;align-self:flex-start}

.cdnum{font-family:var(--display);font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}

.tips h4{margin-top:4px}

.wheel-wrap{position:relative;width:min(280px,80vw);aspect-ratio:1;margin:0 auto}
.wheel-wrap svg{width:100%;height:100%;display:block}

.pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--ink)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--brand);color:var(--brand-ink);font-weight:700}
.btn.sub{background:var(--court);color:var(--ink)}
.btn.warn{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:80px 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.num{font-family:var(--display);font-size:18px;min-width:44px;padding:0 6px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--court);font-variant-numeric:tabular-nums;flex:none}
.player{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.player:first-child{border-top:0}
.svrow{background:var(--surface);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
.svrow .grip{color:var(--muted);font-size:18px;cursor:grab;touch-action:none}
.svrow.lift{z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.18);border-radius:10px;transition:none}
.svrow.shift{transition:transform .15s ease}

.player .nm{flex:1;min-width:0}
.player .nm b{display:block;overflow-wrap:anywhere}
.ev{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.date{font-variant-numeric:tabular-nums;text-align:center;border-radius:10px;background:var(--court);padding:4px 0;line-height:1.2}
.date b{display:block;font-family:var(--display);font-size:18px}
.date span{font-size:11px;color:var(--muted)}
.days{font-family:var(--display);font-size:13px;color:var(--atk);white-space:nowrap}
.note{font-size:12px;border-radius:10px;padding:8px 10px;background:var(--court);color:var(--muted)}
.icon-btn{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 6px;text-decoration:underline}
.err{color:var(--danger);font-size:12px}
.result{font-family:var(--display);font-size:20px;text-align:center}
</style>
</head>

function LSobj(k){ try{ const v=JSON.parse(localStorage.getItem(k)||"{}"); return v&&typeof v==="object"?v:{}; }catch(e){ return {}; } }
function lum(hex){ const m=/^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m) return null; const n=parseInt(m[1],16); const c=[n>>16&255,n>>8&255,n&255].map(v=>{ v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); }); return .2126*c[0]+.7152*c[1]+.0722*c[2]; }
function applyTheme(){

function useLocal(){ D.mode="local"; D.settings=LSobj("vb-settings"); applyTheme(); D.roster=LS.get("vb-roster"); D.events=LS.get("vb-events"); D.lineups=LS.get("vb-lineups"); D.boards=LS.get("vb-boards"); render(); }
async function initData(){
  if(!window.claude || typeof window.claude.use!=="function"){ useLocal(); return; }
  try{
    DB = await window.claude.use("db");
    if(!DB){ useLocal(); return; }
    try{ const u = await window.claude.use("user"); if(u){ const w = await u.can("data.write"); if(w===false) D.canWrite=false; } }catch(e){}
    D.mode="db";
    let got = {r:false,e:false};
    const timer = setTimeout(()=>{ if(!got.r||!got.e){ D.note="データに接続できていません。少し待つか、通信状況を確認してください。"; render(); } },10000);
    const done = ()=>{ if(got.r&&got.e){ clearTimeout(timer); D.note=""; } };
    DB.collection("roster").onSnapshot(s=>{ D.roster=s.docs.map(d=>({id:d.id,...d.data()})); if(!s.metadata.fromCache){got.r=true;done();} render(); },e=>{ clearTimeout(timer); D.note="名簿を読み込めませんでした。"; render(); });
    DB.collection("events").onSnapshot(s=>{ D.events=s.docs.map(d=>({id:d.id,...d.data()})); if(!s.metadata.fromCache){got.e=true;done();} render(); },e=>{ clearTimeout(timer); D.note="大会予定を読み込めませんでした。"; render(); });
    DB.doc("settings/team").onSnapshot(s=>{ if(S.dragging) return; D.settings=s.exists?JSON.parse(JSON.stringify(s.data()||{})):{}; applyTheme(); render(); },e=>{});
    DB.collection("boards").onSnapshot(s=>{ D.boards=s.docs.map(d=>({id:d.id,...d.data()})); render(); },e=>{});
    DB.collection("lineups").onSnapshot(s=>{ D.lineups=s.docs.map(d=>({id:d.id,...d.data()})); render(); },e=>{ D.note="オーダーを読み込めませんでした。"; render(); });
    render();
  }catch(e){ useLocal(); }
}
async function save(col,id,obj){
  D.err="";
  if(D.mode==="db"){
    try{ if(id){ await DB.collection(col).doc(id).set(obj); return id; } const ref=DB.collection(col).doc(); await ref.set(obj); return ref.id; }
    catch(e){ if(e&&e.code==="invalid_argument"){ D.canWrite=false; D.err="編集の権限がありません。キャプテンに共有設定を確認してください。"; } else if(e&&e.code==="quota_exceeded"){ D.err="保存できる件数の上限です。古い予定を削除してください。"; } else D.err="保存できませんでした。もう一度試してください。"; render(); return false; }
  }
  const arr = D[col]; const nid = id || ("l"+Date.now());
  if(id){ const i=arr.findIndex(x=>x.id===id); if(i>=0) arr[i]={id,...obj}; } else arr.push({id:nid,...obj});
  LS.set("vb-"+col,arr); return nid;
}
async function remove(col,id){
  if(D.mode==="db"){ try{ await DB.collection(col).doc(id).delete(); }catch(e){ D.err="削除できませんでした。"; render(); } return; }
  D[col]=D[col].filter(x=>x.id!==id); LS.set("vb-"+col,D[col]);
}

function syncServe(sd){ const placed=POS_ORDER.map(p=>sd.pos[p]).filter(Boolean); const sv=sd.serve.filter(id=>placed.includes(id)); placed.forEach(id=>{ if(!sv.includes(id)) sv.push(id); }); sd.serve=sv; return sd; }

/* ---------- helpers ---------- */
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseD(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); if(!y) return null; return new Date(y,m-1,d); }
function daysTo(s){ const d=parseD(s); return d?Math.round((d-today())/864e5):null; }
const WD = ["日","月","火","水","木","金","土"];
const endOf = e=>(e.end&&e.end>=e.date)?e.end:e.date;
function upcoming(){ return D.events.filter(e=>{const n=daysTo(endOf(e));return n!==null&&n>=0}).sort((a,b)=>a.date<b.date?-1:1); }
function past(){ return D.events.filter(e=>{const n=daysTo(endOf(e));return n===null||n<0}).sort((a,b)=>a.date>b.date?-1:1); }
function nextTournament(){ return upcoming().find(e=>(e.kind||"大会")==="大会"); }
function countdown(){
  const t=nextTournament(); if(!t) return "";
  const n=daysTo(t.date), live=n<=0;
  return `<div class="banner cd"><span class="muted">次の大会まで</span><div class="row" style="align-items:baseline;gap:6px">${live?`<b class="cdnum">開催中</b>`:`<b class="cdnum">${n}</b><span>日</span>`}</div><span style="overflow-wrap:anywhere">${esc(t.name)}　${esc(rangeText(t))}</span></div>`;
}
function md(s){ const d=parseD(s); return d?`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`:""; }
function rangeText(e){ return e.end&&e.end>e.date?`${md(e.date)}〜${md(e.end)}`:md(e.date); }

function setupFormEdit(){
  const svg=document.getElementById("fcourt"); if(!svg) return;
  let drag=null;
  svg.addEventListener("pointerdown",e=>{ const g=e.target.closest("[data-pos]"); if(!g) return; const p=svgPt(svg,e); drag={k:g.dataset.pos,x0:p.x,y0:p.y,moved:false,f:formation(S.form)}; S.dragging=true; try{svg.setPointerCapture(e.pointerId);}catch(err){} e.preventDefault(); });
  svg.addEventListener("pointermove",e=>{ if(!drag) return; const p=svgPt(svg,e); if(Math.hypot(p.x-drag.x0,p.y-drag.y0)>4) drag.moved=true; if(!drag.moved) return; drag.f.pts={...drag.f.pts,[drag.k]:[clamp(Math.round(p.x),18,282),clamp(Math.round(p.y),20,282)]}; svg.innerHTML=courtInner(S.form,null,drag.f); });
  const end=()=>{ if(!drag) return; const d=drag; drag=null; S.dragging=false;
    if(d.moved) saveFormation(S.form,{pts:d.f.pts});
    else { const bl=new Set(d.f.block); bl.has(d.k)?bl.delete(d.k):bl.add(d.k); saveFormation(S.form,{block:[...bl]}); }
    render.pending=false; render(); };
  svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);
}

function buildPlan(){
  const t = THEMES[S.theme], n = S.ppl, out=[]; let min=0;
  const push=(k,ov)=>{ const d={...DRILLS[k],...(ov||{})}; out.push([min,d]); min+=d.m; };
  push("kiso");
  push(S.men||t.men);
  t.seq.forEach(k=>push(k));
  const left = 115-min;
  if(n>=18) push("game",{m:left}); else if(n>=10) push("small",{m:left}); else push("dig",{n:"強打レシーブ＋判断ドリル（延長）",m:left,why:"9人以下なので試合形式の代わり"});
  push("review");
  return out;
}
const fmt = m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;
function wheelSVG(){
  const keys=Object.keys(THEMES), n=keys.length, R=140, cx=150, cy=150; let s=`<svg viewBox="0 0 300 300" aria-hidden="true"><g id="wheel" style="transform:rotate(${S.rot}deg)">`;
  keys.forEach((k,i)=>{ const a0=(i/n)*2*Math.PI-Math.PI/2, a1=((i+1)/n)*2*Math.PI-Math.PI/2, am=(a0+a1)/2;
    const p=(a)=>[cx+R*Math.cos(a),cy+R*Math.sin(a)];
    const [x0,y0]=p(a0),[x1,y1]=p(a1);
    s+=`<path d="M${cx},${cy} L${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1} Z" fill="${THEMES[k].c}" stroke="var(--surface)" stroke-width="3"/>`;
    const tx=cx+R*.62*Math.cos(am), ty=cy+R*.62*Math.sin(am); let deg=am*180/Math.PI+90; const nd=((deg%360)+360)%360; if(nd>90&&nd<270) deg+=180;
    const lab=THEMES[k].n; const parts = lab.length>6?[lab.slice(0,Math.ceil(lab.length/2)),lab.slice(Math.ceil(lab.length/2))]:[lab];
    s+=`<text transform="translate(${tx},${ty}) rotate(${deg})" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="var(--body)">${parts.map((p,j)=>`<tspan x="0" dy="${j?16:(parts.length>1?-4:4)}">${esc(p)}</tspan>`).join("")}</text>`; });
  s+=`<circle cx="${cx}" cy="${cy}" r="22" fill="var(--surface)" stroke="var(--line)"/></g></svg>`;
  return s;
}

}

const HAND=11;
function projX(H,px,py,ty){ return H.x+(px-H.x)*(ty-H.y)/(py-H.y); }
function isBlocked(H,T){ const xNet=projX(H,T.x,T.y,NET); return blockers().some(b=>Math.abs(xNet-b.x)<=HAND); }
function courses(){
  const H=hitPoint(); const farX = H.x<BW/2 ? BW-2 : 2; const nearX = H.x<BW/2 ? 2 : BW-2;
  return [
    {k:"straight",n:"ストレート",T:{x:clamp(H.x,4,BW-4),y:BH-4}},
    {k:"cross",n:"クロス",T:{x:farX,y:BH-4}},
    {k:"inner",n:"インナー",T:{x:farX,y:NET+95}},
    {k:"long",n:"センター奥",T:{x:BW/2+(farX-BW/2)*0.25,y:BH-4}}

}
function segDist(P,A,B){ const vx=B.x-A.x, vy=B.y-A.y; const t=clamp(((P.x-A.x)*vx+(P.y-A.y)*vy)/(vx*vx+vy*vy),0,1); const q={x:A.x+vx*t,y:A.y+vy*t}; return {d:Math.hypot(P.x-q.x,P.y-q.y),q}; }
function coverage(){
  const H=hitPoint(); const defs=S.board.players.filter(p=>p.y>NET+30);
  return courses().map(c=>{
    if(c.blocked) return {...c,who:null};
    const sy=c.k==="inner"?NET+30:NET+100; const A={x:H.x+(c.T.x-H.x)*((sy-H.y)/(c.T.y-H.y)),y:sy};
    let best=null; defs.forEach(p=>{ const r=segDist(p,A,c.T); if(!best||r.d<best.d) best={p,...r}; });
    return {...c,who:best};

function recvWeight(p){ return p.id==="M"?0.85:1; }
function nearest2(x,y,list){ let a=null,b=null; list.forEach(p=>{ const d=Math.hypot(p.x-x,p.y-y)*recvWeight(p); if(!a||d<a.d){ b=a; a={p,d}; } else if(!b||d<b.d) b={p,d}; }); return [a,b]; }

  else if(d.fedit!==undefined){ S.fedit=d.fedit==="1"; S.sel=null; window.scrollTo(0,0); }
  else if(d.freset){ const F={...(((D.settings||{}).formations)||{})}; delete F[S.form]; saveSettings({formations:F}); }
  else if(d.fdel){ if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="もう一度押すと削除"; return; } const k=S.form; saveSettings({scenes:sceneList().filter(x=>x.id!==k),formations:Object.fromEntries(Object.entries(((D.settings||{}).formations)||{}).filter(([kk])=>kk!==k))}); S.form="recv"; }
  else if(d.pos) S.sel = S.sel===d.pos?null:d.pos;
  else if(d.target){ if(S.tedit&&S.tmoved){ S.tmoved=false; return; } S.target = S.target===+d.target&&!S.tedit?null:+d.target; }
  else if(d.tedit!==undefined){ S.tedit=d.tedit==="1"; }
  else if(d.tadd){ const ts=JSON.parse(JSON.stringify(targets())); const n=ts.reduce((a,b)=>Math.max(a,b.n),0)+1; ts.push({n,x:150,y:150,r:16,h:"新しい狙い所",b:"",tag:"基本"}); saveSettings({serveTargets:ts}); S.target=n; }
  else if(d.treset){ saveSettings({serveTargets:null}); S.target=null; }
  else if(d.tdel){ if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="もう一度押すと削除"; return; } const ts=targets().filter(x=>x.n!==+d.tdel); saveSettings({serveTargets:ts.length?ts:null}); S.target=null; }
  else if(d.skill!==undefined){ S.tab="skills"; S.skill=d.skill||null; S.target=null; window.scrollTo(0,0); }
  else if(d.mine){ S.mine = S.mine===d.mine?null:d.mine; try{ S.mine?localStorage.setItem("vb-mine",S.mine):localStorage.removeItem("vb-mine"); }catch(err){} }
  else if(d.theme){ S.theme=d.theme; S.picked=null; S.men=null; }
  else if(d.ppl){ S.ppl=Math.min(40,Math.max(1,S.ppl+(+d.ppl))); }
  else if(d.kiso) S.kiso=d.kiso;
  else if(d.spin){ return spin(); }
  else if(d.teamsub){ S.teamSub=d.teamsub; S.editR=S.editE=null; D.err=""; return freshRender(); }
  else if(d.editR){ S.editR=d.editR; freshRender(); document.getElementById("fr")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  else if(d.editE){ S.editE=d.editE; freshRender(); document.getElementById("fe")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  else if(d.cancel){ if(d.cancel==="r") S.editR=null; else S.editE=null; return freshRender(); }
  else if(d.delR){ askDelete("roster",d.delR,t); return; }
  else if(d.delE){ askDelete("events",d.delE,t); return; }
  else if(d.past) S.showPast=!S.showPast;
  else if(d.men) S.men=d.men;
  else if(d.lu){ S.luId=d.lu; S.luSet="s1"; S.luPos=null; window.scrollTo(0,0); }
  else if(d.luback){ S.luId=null; S.luPos=null; }
  else if(d.luset){ S.luSet=d.luset; S.luPos=null; }
  else if(d.lupos){ S.luPos = S.luPos===d.lupos?null:d.lupos; render(); if(S.luPos) document.getElementById("picker")?.scrollIntoView({behavior:"smooth",block:"nearest"}); return; }
  else if(d.regonly!==undefined){ S.regOnly=t.checked; }
  else if(d.assign){ const sd=setData(lu(),S.luSet); POS_ORDER.forEach(p=>{ if(sd.pos[p]===d.assign) delete sd.pos[p]; }); sd.pos[S.luPos]=d.assign; S.luPos=null; return writeSet(S.luSet,sd); }
  else if(d.unassign){ const sd=setData(lu(),S.luSet); delete sd.pos[S.luPos]; S.luPos=null; return writeSet(S.luSet,sd); }
  else if(d.svmove){ const [i,dir]=d.svmove.split(":").map(Number); const sd=syncServe(setData(lu(),S.luSet)); const j=i+dir; if(j<0||j>=sd.serve.length) return; [sd.serve[i],sd.serve[j]]=[sd.serve[j],sd.serve[i]]; return writeSet(S.luSet,sd); }
  else if(d.copyset){ const prev=SETS[SETS.indexOf(S.luSet)-1]; return writeSet(S.luSet,setData(lu(),prev)); }
  else if(d.delL){ askDelete("lineups",d.delL,t); return; }
  else if(d.brand){ saveSettings({brand:d.brand}); }
  else if(d.accent){ saveSettings({accent:d.accent}); }
  else if(d.themereset){ saveSettings({brand:null,accent:null}); }
  else if(d.bkind){ S.bkind=d.bkind; }
  else if(d.bmode){ S.bmode=d.bmode; }
  else if(d.bshow){ S.bshow[d.bshow]=!S.bshow[d.bshow]; }
  else if(d.bundo){ S.board.strokes.pop(); saveBoardCur(); }
  else if(d.bpreset){ const k=$("#bpreset").value; const old=S.board; S.board={...clonePreset(k,S.bkind),srv:{...old.srv},ball:{...old.ball},atk:k.startsWith("p")?{...old.atk}:clonePreset(k,S.bkind).atk}; saveBoardCur(); }
  else if(d.rshow){ S.rshow[d.rshow]=!S.rshow[d.rshow]; }
  else if(d.bclear){ S.board.strokes=[]; saveBoardCur(); }
  else if(d.bload){ const b=(D.boards||[]).find(x=>x.id===d.bload); if(b){ S.bkind=b.kind==="recv"?"recv":"dig"; S.board={kind:S.bkind,preset:b.preset||"",players:(b.players||[]).map(x=>({...x})),atk:{...(b.atk||{x:150,y:60})},srv:{...(b.srv||{x:150})},ball:{...(b.ball||{x:150,y:NET+170})},strokes:(b.strokes||[]).map(st=>typeof st==="string"?st.split(" ").map(q=>q.split(",").map(Number)):st.map(p=>[...p]))}; saveBoardCur(); window.scrollTo(0,0); } }
  else if(d.bdel){ askDelete("boards",d.bdel,t); return; }
  else if(d.export){ S.xferOpen=true; const txt=exportJSON();
    if(d.export==="copy"){ (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{S.xferMsg="コピーしました。LINEなどに貼り付けて送れます。";render();}).catch(()=>{S.xferMsg="コピーできませんでした。";render();}); return; }
    try{ const a=document.createElement("a"); const day=new Date().toISOString().slice(0,10); a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"})); a.download=`volley-book-${day}.json`; document.body.appendChild(a); a.click(); a.remove(); S.xferMsg=STANDALONE?"ファイルを書き出しました。":"この画面ではファイルを保存できない場合があります。うまくいかなければ「文字でコピー」を使ってください。"; }catch(err){ S.xferMsg="書き出せませんでした。「文字でコピー」を使ってください。"; }
  }
  else if(d.import){ const v=$("#xpaste").value.trim(); if(!v){ S.xferMsg="貼り付け欄が空です。"; S.xferOpen=true; } else { importData(v); return; } }
  render();
});
function askDelete(col,id,btn){
  if(btn.dataset.armed){ remove(col,id).then(()=>{ if(col==="roster") S.editR=null; else if(col==="events") S.editE=null; else if(col==="lineups") S.luId=null; freshRender(); }); return; }
  btn.dataset.armed="1"; btn.textContent="もう一度押すと削除"; setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent="削除"; } },4000);
}
function spin(){
  if(S.spinning) return;
  const keys=Object.keys(THEMES), n=keys.length, i=Math.floor(Math.random()*n), seg=360/n;
  const target = 360 - (i*seg + seg/2);
  const base = S.rot - (S.rot % 360);
  const next = base + 360*5 + target + (Math.random()-.5)*seg*.6;
  S.spinning=true; S.picked=null; render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const w=document.getElementById("wheel"); if(w) w.style.transform=`rotate(${next}deg)`; S.rot=next; }));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{ S.spinning=false; S.picked=keys[i]; S.theme=keys[i]; S.men=null; render(); }, reduce?50:3300);
}
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="fr"){
    const num=$("#rnum").value.trim(), name=$("#rname").value.trim(), err=$("#rerr");
    if(num===""||!/^\d{1,3}$/.test(num)){ err.textContent="背番号を3桁までの数字で入れてください。"; return; }
    if(!name){ err.textContent="名前を入れてください。"; return; }
    const taken=(document.getElementById("taken")?.textContent||"").split(",");
    if(taken.includes(num)){ err.textContent=`背番号${num}はすでに使われています。`; return; }
    const ok = await save("roster",S.editR,{num:num,name,pos:$("#rpos").value,reg:$("#rreg").checked});
    if(ok){ S.editR=null; freshRender(); }
  }
  if(e.target.id==="ffe"){ const note=$("#fnote").value.trim(); saveFormation(S.form,{note}); const fn=$("#fname"); if(fn){ const nm=fn.value.trim(); if(nm) saveSettings({scenes:sceneList().map(x=>x.id===S.form?{...x,label:nm}:x)}); } freshRender(); return; }
  if(e.target.id==="fnew"){ const nm=$("#fnewname").value.trim(); if(!nm){ $("#ferr").textContent="新しい場面の名前を入れてください。"; return; } if(sceneList().length>=8){ $("#ferr").textContent="追加できる場面は8つまでです。"; return; }
    const f=formation(S.form); const id="c"+Date.now().toString(36); const F={...(((D.settings||{}).formations)||{})}; F[id]={pts:f.pts,block:f.block,tri:f.tri.map(t=>t.join(",")),note:f.note};
    saveSettings({scenes:[...sceneList(),{id,label:nm,from:f.from in FORM?f.from:"recv"}],formations:F}); S.form=id; freshRender(); return; }
  if(e.target.id==="fte"){ const ts=JSON.parse(JSON.stringify(targets())); const t=ts.find(x=>x.n===S.target); if(t){ t.h=$("#th").value.trim()||t.h; t.b=$("#tb").value.trim(); t.tag=$("#ttag").value; saveSettings({serveTargets:ts}); } freshRender(); return; }
  if(e.target.id==="fb"){
    const name=$("#bname").value.trim(); if(!name){ $("#berr").textContent="ボードの名前を入れてください。"; return; }
    const B=S.board; const body={name,kind:S.bkind,preset:B.preset||"",players:B.players,atk:B.atk,srv:B.srv,ball:B.ball,strokes:B.strokes.map(st=>st.map(p=>p[0]+","+p[1]).join(" ")),updated:new Date().toISOString()};
    if(JSON.stringify(body).length>200000){ $("#berr").textContent="書き込みが多すぎて保存できません。一部を消してください。"; return; }
    const id=await save("boards",null,body); if(id){ S.xferMsg=""; freshRender(); }
  }
  if(e.target.id==="fl"){
    const name=$("#lname").value.trim(); if(!name){ $("#lerr").textContent="オーダー表の名前を入れてください。"; return; }
    const id = await save("lineups",null,{name,date:$("#ldate").value,sets:{}});
    if(id){ S.luId=id; S.luSet="s1"; S.luPos=null; freshRender(); window.scrollTo(0,0); }
  }
  if(e.target.id==="fe"){
    const date=$("#edate").value, name=$("#ename").value.trim(), err=$("#eerr");
    if(!date){ err.textContent="日付を選んでください。"; return; }
    if(!name){ err.textContent="予定の名前を入れてください。"; return; }
    const end=$("#eend").value;
    if(end&&end<date){ err.textContent="最終日は開始日より後の日付にしてください。"; return; }
    const ok = await save("events",S.editE,{date,end:end&&end>date?end:"",kind:$("#ekind").value,name,place:$("#eplace").value.trim(),deadline:$("#edl").value,memo:$("#ememo").value.trim()});
    if(ok){ S.editE=null; freshRender(); }
  }
});
document.addEventListener("change",e=>{ if(e.target.id==="cbrand"){ saveSettings({brand:e.target.value}); render(); return; } if(e.target.id==="caccent"){ saveSettings({accent:e.target.value}); render(); return; } if(e.target.id==="ximport"&&e.target.files[0]){ const f=e.target.files[0]; f.text().then(importData); } });
document.addEventListener("toggle",e=>{ if(e.target.id==="xfer") S.xferOpen=e.target.open; },true);
document.addEventListener("input",e=>{ if(e.target.closest("form")){ const er=e.target.closest("form").querySelector(".err"); if(er) er.textContent=""; } });
document.addEventListener("keydown",e=>{ const g=e.target.closest&&e.target.closest("[data-pos],[data-target],[data-lupos]"); if(g&&g.tagName!=="BUTTON"&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); g.dispatchEvent(new MouseEvent("click",{bubbles:true})); }});
render();
initData();
if(STANDALONE && "serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
</body>
