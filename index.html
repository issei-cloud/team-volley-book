<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="バレー帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: phone-first single column, sticky bottom tab bar; court diagrams lead each view */
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#16213A; --muted:#5D6880; --line:#DCE1EA;
  --accent:#F2A900; --accent-ink:#5A3E00; --court:#E8EEF7; --atk:#D9481F; --def:#17806A; --set:#5F6673;
  --atk-bg:#FCE7DF; --def-bg:#DDF2EC; --set-bg:#ECEEF1; --danger:#B42318;
  --display:"Zen Maru Gothic","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1524; --surface:#18213A; --ink:#E9EDF5; --muted:#A3AEC4; --line:#2B3654;
    --accent:#F5B82E; --accent-ink:#2A1C00; --court:#1E2A47; --atk:#FF7A52; --def:#3CC4A2; --set:#A1A8B5;
    --atk-bg:#4A2216; --def-bg:#123C33; --set-bg:#2B3348; --danger:#FF8A7A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1524; --surface:#18213A; --ink:#E9EDF5; --muted:#A3AEC4; --line:#2B3654;
  --accent:#F5B82E; --accent-ink:#2A1C00; --court:#1E2A47; --atk:#FF7A52; --def:#3CC4A2; --set:#A1A8B5;
  --atk-bg:#4A2216; --def-bg:#123C33; --set-bg:#2B3348; --danger:#FF8A7A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
header.top{padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
header.top h1{font-family:var(--display);font-size:22px;margin:0;letter-spacing:.02em}
header.top .who{font-size:12px;color:var(--muted);text-align:right}
main{max-width:640px;margin:0 auto;padding:0 calc(16px + env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 11px;font:12px/1.5 ui-monospace,monospace}
.view{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:18px;margin:6px 0 0;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:700}
h4{font-size:14px;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--court);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.court svg{width:100%;height:auto;display:block}
.court .pl,.court .tg{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
.role{border-left:4px solid var(--c);border-radius:0;padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--tbg);color:var(--c);font-weight:700;white-space:nowrap}
ul.clean,ol.clean{margin:0;padding-left:1.2em}
ul.clean li,ol.clean li{margin:2px 0}
.cue{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:1px 8px;font-weight:700}
.list-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.list-btn small{color:var(--muted);font-size:12px}
.arrow{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px}
.sym-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;background:var(--surface);text-align:left;width:100%}
.sym-row b{font-size:14px}
.sym-row .c{font-size:13px;color:var(--muted)}
input[type=search],input[type=text],input[type=number],input[type=date],select{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit;min-width:0}
.back{border:0;background:none;color:var(--muted);padding:0;font-size:13px;align-self:flex-start}
.slot{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.slot:first-child{border-top:0}
.slot time{font-size:13px;color:var(--muted)}
.why{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--court);font-size:22px;line-height:1;font-weight:700}
.stepper input{width:76px;text-align:center;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.rule-num{font-family:var(--display);color:var(--accent);font-size:18px;line-height:1}
.rule{display:grid;grid-template-columns:22px 1fr;gap:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
.banner{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.banner .muted{color:inherit;opacity:.75}
.cdnum{font-family:var(--display);font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--def);width:18px;height:18px;flex:none}
.tips h4{margin-top:4px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
table.t th{font-weight:700;color:var(--muted);font-size:12px;border-top:0}
.wheel-wrap{position:relative;width:min(280px,80vw);aspect-ratio:1;margin:0 auto}
.wheel-wrap svg{width:100%;height:100%;display:block}
#wheel{transition:transform 3.2s cubic-bezier(.12,.75,.12,1);transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){#wheel{transition:none}}
.pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--ink)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.sub{background:var(--court);color:var(--ink)}
.btn.warn{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:80px 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.num{font-family:var(--display);font-size:18px;min-width:44px;padding:0 6px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--court);font-variant-numeric:tabular-nums;flex:none}
.player{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.player:first-child{border-top:0}
.player .nm{flex:1;min-width:0}
.player .nm b{display:block;overflow-wrap:anywhere}
.ev{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.date{font-variant-numeric:tabular-nums;text-align:center;border-radius:10px;background:var(--court);padding:4px 0;line-height:1.2}
.date b{display:block;font-family:var(--display);font-size:18px}
.date span{font-size:11px;color:var(--muted)}
.days{font-family:var(--display);font-size:13px;color:var(--atk);white-space:nowrap}
.note{font-size:12px;border-radius:10px;padding:8px 10px;background:var(--court);color:var(--muted)}
.icon-btn{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 6px;text-decoration:underline}
.err{color:var(--danger);font-size:12px}
.result{font-family:var(--display);font-size:20px;text-align:center}
</style>
</head>
<body>
<header class="top">
  <h1>チームバレー帳</h1>
  <span class="who" id="who"></span>
</header>
<main id="app"></main>
<nav class="tabs" aria-label="メニュー">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3.5 9.5c5 1 12 1 17 0M12 3c-3 4-3 14 0 18"/></svg>ホーム</button>
  <button data-tab="tactics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M4 7h16"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="12" cy="17" r="1.3"/></svg>戦術</button>
  <button data-tab="skills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg>技術</button>
  <button data-tab="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>練習</button>
  <button data-tab="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.5a3 3 0 0 1 0 5.5M18 14c2 .8 3 3 3 6"/></svg>チーム</button>
</nav>
<script>
/* ---------- content ---------- */
const POS = {
  S:{name:"セッター",grp:"set",duty:["2本目をトスにして攻撃を組み立てる","センター攻撃では3枚ブロックに入る"],rule:["1本目を触ったらすぐ「お願い！」","取るのは正面の強打とフェイントだけ"],cards:["toss"],kiso:"setter"},
  L:{name:"前衛レフト",grp:"atk",duty:["スパイク（得点源）とレフト側のブロック","ブロックに入らない時はインナー処理と次の攻撃準備"],rule:["2段トスでは触らず開いて「レフト！」","ネットから3m前後下がり、アタッカーに体を向ける"],cards:["spike","block"],kiso:"spiker"},
  LC:{name:"前衛 左C",grp:"atk",duty:["ブロックの中心、速攻","反対側のブロック時は三角形の前の角"],rule:["第2セッターのトスで打てる準備をして呼ぶ","三角形では中央寄りの短いクロスを担当"],cards:["block","spike"],kiso:"spiker"},
  RC:{name:"前衛 右C（第2セッター）",grp:"atk",duty:["ブロック、速攻","セッターの代わりにトスを上げる"],rule:["「お願い！」で「トス！」と言って入る","高く、ネットから離して。アンダーでもOK"],cards:["toss","block"],kiso:"spiker"},
  R:{name:"前衛ライト",grp:"atk",duty:["スパイクとライト側のブロック","ブロックに入らない時はインナー処理と次の攻撃準備"],rule:["2段トスでは触らず開いて「ライト！」","ネットから3m前後下がり、アタッカーに体を向ける"],cards:["spike","block"],kiso:"spiker"},
  M:{name:"中衛（レシーブ専門）",grp:"def",duty:["サーブレシーブと強打レシーブの中心","ラリー中はフェイントとブロック後ろのボール"],rule:["関わる境界はすべて中衛優先","一番早く「オーライ」を出す"],cards:["recv","dig","basic"],kiso:"receiver"},

  BR:{name:"後衛R",grp:"def",duty:["右奥の強打、カバー、声出し","反対側の攻撃では三角形の奥"],rule:["1列目の頭上は全部自分のボール","中衛のオーライでカバーへ"],cards:["dig","recv"],kiso:"receiver"}
};
const GRP = {atk:{c:"var(--atk)",bg:"var(--atk-bg)",label:"前衛"},def:{c:"var(--def)",bg:"var(--def-bg)",label:"守備"},set:{c:"var(--set)",bg:"var(--set-bg)",label:"セッター"}};
const SHORT = {S:"S",L:"レフト",LC:"左C",RC:"右C",R:"ライト",M:"中衛",BL:"後L",BC:"後C",BR:"後R"};
const FORM = {
  recv:{label:"レシーブ",note:"前衛4人と中衛が横1列。肩より高いボールは見送って後衛へ。",pts:{S:[200,30],L:[40,95],LC:[95,95],M:[150,95],RC:[205,95],R:[260,95],BL:[65,230],BC:[150,230],BR:[235,230]},block:[],tri:[]},
  side:{label:"サイド攻撃",note:"相手レフトの攻撃。ライト・右Cの2枚ブロック、左C・中衛・後Lで三角形。",pts:{RC:[220,24],R:[262,24],S:[170,52],L:[38,62],LC:[105,80],M:[180,112],BL:[62,228],BC:[150,255],BR:[245,222]},block:["RC","R"],tri:[["LC","M","BL"]]},
  center:{label:"センター攻撃",note:"左C・S・右Cの3枚ブロック。中衛を頂点に左右2つの三角形（案）。",pts:{LC:[108,24],S:[150,24],RC:[192,24],L:[38,88],M:[150,98],R:[262,88],BL:[52,225],BC:[150,258],BR:[248,225]},block:["LC","S","RC"],tri:[["L","M","BL"],["R","M","BR"]]}
};
const RULES = [
  {h:"声は3種類だけ",b:["取る「オーライ」","譲る「任せた」","警戒「フェイント！」"]},
  {h:"迷ったら：中衛 → 後ろ → 先に声",b:["中衛が関わる境界は中衛","前後なら後ろの人","それでも迷えば先に声を出した人"]},
  {h:"サーブレシーブは高さで決める",b:["肩より高いボールは1列目が見送る","サーバーが打った直後に「任せた」","後衛は1列目の頭上を全部取るつもりで"]},
  {h:"前後のボールは頂点までに決める",b:["迷ったら触らずに、よける","後ろは「前は抜けてくる」前提で構える"]},
  {h:"2段トスは「打つ人が呼び、それ以外が上げる」",b:["レフト・ライトは触らず開いて呼ぶ","上げる順：セッター → 右C → 一番近い人","上げる人は「トス！」と宣言"]},
  {h:"セッターが1本目を触ったら",b:["セッター「お願い！」","右C「トス！」で2本目へ"]},
  {h:"ラリー中は三角形で守る",b:["ブロックが閉めたコースは捨てる","三角形の内側は中衛","外の手前は前の角、外の奥は後衛"]}
];
const CARD_GROUPS = [
  {h:"サーブ",ids:["floater","jfloat","jump","under","serveTarget"]},
  {h:"攻撃",ids:["spike","toss"]},
  {h:"守備",ids:["basic","recv","dig","block"]}
];
const CARDS = {
  basic:{t:"基本動作",sub:"スプリットステップ・目線・面",point:"すべてのレシーブの土台。打つ瞬間に準備が終わっているか。",rows:[["反応が遅れる","相手が打つ瞬間に足が止まっている","打つ瞬間にトン"],["コースが読めない","ボールだけを目で追っている","トスが上がったら、打つ人を見る"],["レシーブが散らばる","腕を振って当てている","腕を振らずに、面を向けるだけ"]],
    tips:[{h:"スプリットステップ",b:["相手が打つ瞬間に数cm跳び、両足同時に着地して動き出す","足は肩幅より少し広く、かかとを少し浮かせる"]},{h:"目線",b:["ボール → セッター → アタッカー（助走・肩・腕）→ ボール","ボールを凝視せず、相手全体を見る"]},{h:"面の作り方（アンダー）",b:["親指をそろえて組み、肘を伸ばす","手首と肘の間の平らな部分で当てる","面を返したい方向に向ける。横のボールは肩を入れて面だけでも向ける"]}]},
  floater:{t:"フローターサーブ",sub:"チームの基本サーブ",point:"1本制なので「入れる → コース → 強さ」の順。",rows:[["ネットにかかる","トスが低い、打点が下がっている","トスは少し高めに、打点を上げて"],["奥にアウトする","下からこすり上げている、体が後ろに倒れる","当てて止める、体重は前へ"],["左右にぶれる","トスの位置が毎回違う","トスは毎回同じ場所に"],["揺れない","手首を使って回転がかかる","手首を固めて、真ん中を叩く"],["本番で入らない","緊張で動きが毎回変わる","いつもの手順で打つ"]],
    tips:[{h:"打ち方",b:["打つ手と反対の足を前に出し、体は狙う方向へ","トスは打つ手の肩の前・少し高めに、回転をかけずに上げる","手のひらの硬い部分でボールの中心を押し出し、当てたら止める"]}]},

let DB = null;
const LS = {get(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return []}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function useLocal(){ D.mode="local"; D.roster=LS.get("vb-roster"); D.events=LS.get("vb-events"); D.lineups=LS.get("vb-lineups"); render(); }
async function initData(){
  if(!window.claude || typeof window.claude.use!=="function"){ useLocal(); return; }
  try{
    DB = await window.claude.use("db");
    if(!DB){ useLocal(); return; }
    try{ const u = await window.claude.use("user"); if(u){ const w = await u.can("data.write"); if(w===false) D.canWrite=false; } }catch(e){}
    D.mode="db";
    let got = {r:false,e:false};
    const timer = setTimeout(()=>{ if(!got.r||!got.e){ D.note="データに接続できていません。少し待つか、通信状況を確認してください。"; render(); } },10000);
    const done = ()=>{ if(got.r&&got.e){ clearTimeout(timer); D.note=""; } };
    DB.collection("roster").onSnapshot(s=>{ D.roster=s.docs.map(d=>({id:d.id,...d.data()})); if(!s.metadata.fromCache){got.r=true;done();} render(); },e=>{ clearTimeout(timer); D.note="名簿を読み込めませんでした。"; render(); });
    DB.collection("events").onSnapshot(s=>{ D.events=s.docs.map(d=>({id:d.id,...d.data()})); if(!s.metadata.fromCache){got.e=true;done();} render(); },e=>{ clearTimeout(timer); D.note="大会予定を読み込めませんでした。"; render(); });
    DB.collection("lineups").onSnapshot(s=>{ D.lineups=s.docs.map(d=>({id:d.id,...d.data()})); render(); },e=>{ D.note="オーダーを読み込めませんでした。"; render(); });
    render();
  }catch(e){ useLocal(); }
}
async function save(col,id,obj){
  D.err="";
  if(D.mode==="db"){
    try{ if(id){ await DB.collection(col).doc(id).set(obj); return id; } const ref=DB.collection(col).doc(); await ref.set(obj); return ref.id; }
    catch(e){ if(e&&e.code==="invalid_argument"){ D.canWrite=false; D.err="編集の権限がありません。キャプテンに共有設定を確認してください。"; } else if(e&&e.code==="quota_exceeded"){ D.err="保存できる件数の上限です。古い予定を削除してください。"; } else D.err="保存できませんでした。もう一度試してください。"; render(); return false; }
  }
  const arr = D[col]; const nid = id || ("l"+Date.now());
  if(id){ const i=arr.findIndex(x=>x.id===id); if(i>=0) arr[i]={id,...obj}; } else arr.push({id:nid,...obj});
  LS.set("vb-"+col,arr); return nid;
}
async function remove(col,id){
  if(D.mode==="db"){ try{ await DB.collection(col).doc(id).delete(); }catch(e){ D.err="削除できませんでした。"; render(); } return; }
  D[col]=D[col].filter(x=>x.id!==id); LS.set("vb-"+col,D[col]);
}

function setData(l,k){ const x=((l&&l.sets)||{})[k]||{}; return {pos:{...(x.pos||{})},serve:[...(x.serve||[])]}; }
function syncServe(sd){ const placed=POS_ORDER.map(p=>sd.pos[p]).filter(Boolean); const sv=sd.serve.filter(id=>placed.includes(id)); placed.forEach(id=>{ if(!sv.includes(id)) sv.push(id); }); sd.serve=sv; return sd; }
let luQueue = Promise.resolve();
function writeSet(k,sd){
  const l=lu(); if(!l) return;
  const sets={...(l.sets||{})}; sets[k]=syncServe(sd);
  const body={name:l.name,date:l.date||"",sets};
  const i=D.lineups.findIndex(x=>x.id===l.id); if(i>=0) D.lineups[i]={id:l.id,...body};
  render();
  luQueue = luQueue.then(()=>save("lineups",l.id,body));
}

/* ---------- helpers ---------- */
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseD(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); if(!y) return null; return new Date(y,m-1,d); }
function daysTo(s){ const d=parseD(s); return d?Math.round((d-today())/864e5):null; }
const WD = ["日","月","火","水","木","金","土"];
const endOf = e=>(e.end&&e.end>=e.date)?e.end:e.date;
function upcoming(){ return D.events.filter(e=>{const n=daysTo(endOf(e));return n!==null&&n>=0}).sort((a,b)=>a.date<b.date?-1:1); }
function past(){ return D.events.filter(e=>{const n=daysTo(endOf(e));return n===null||n<0}).sort((a,b)=>a.date>b.date?-1:1); }
function nextTournament(){ return upcoming().find(e=>(e.kind||"大会")==="大会"); }
function countdown(){

function buildPlan(){

function wheelSVG(){

  keys.forEach((k,i)=>{ const a0=(i/n)*2*Math.PI-Math.PI/2, a1=((i+1)/n)*2*Math.PI-Math.PI/2, am=(a0+a1)/2;
    const p=(a)=>[cx+R*Math.cos(a),cy+R*Math.sin(a)];

    s+=`<path d="M${cx},${cy} L${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1} Z" fill="${THEMES[k].c}" stroke="var(--surface)" stroke-width="3"/>`;

    const lab=THEMES[k].n; const parts = lab.length>6?[lab.slice(0,Math.ceil(lab.length/2)),lab.slice(Math.ceil(lab.length/2))]:[lab];
    s+=`<text transform="translate(${tx},${ty}) rotate(${deg})" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="var(--body)">${parts.map((p,j)=>`<tspan x="0" dy="${j?16:(parts.length>1?-4:4)}">${esc(p)}</tspan>`).join("")}</text>`; });
  s+=`<circle cx="${cx}" cy="${cy}" r="22" fill="var(--surface)" stroke="var(--line)"/></g></svg>`;
  return s;
}

  if(D.canWrite&&S.luPos){
    const cur=sd.pos[S.luPos]; const where={}; POS_ORDER.forEach(p=>{ if(sd.pos[p]) where[sd.pos[p]]=p; });
    const cands=[...D.roster].filter(p=>!S.regOnly||p.reg).sort((a,b)=>(+a.num||9999)-(+b.num||9999));
    h+=`<div class="card" id="picker"><div class="row" style="justify-content:space-between"><h3>${esc(POS[S.luPos].name)} に入れる選手</h3><button class="icon-btn" data-lupos="${S.luPos}">閉じる</button></div>
    <label class="check"><input type="checkbox" data-regonly="1" ${S.regOnly?"checked":""}><span>選手登録済みの人だけ表示</span></label>
    ${cands.length?`<div>${cands.map(p=>`<button class="player" style="width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left" data-assign="${esc(p.id)}"><span class="num">${esc(p.num??"-")}</span><span class="nm"><b>${esc(p.name)}</b><span class="muted">${esc(posLabel(p.pos))}${where[p.id]?`・いま ${SHORT[where[p.id]]==="S"?"セッター":SHORT[where[p.id]]}`:""}</span></span>${cur===p.id?`<span class="tag" style="--c:var(--def);--tbg:var(--def-bg)">選択中</span>`:""}</button>`).join("")}</div>`:`<p class="muted">表示できる選手がいません。チェックを外すか、名簿に追加してください。</p>`}
    ${cur?`<button class="btn warn" data-unassign="1">このポジションを空ける</button>`:""}</div>`;
  }
  h+=`<div class="card"><h3>サーブ順（${SET_LABEL[S.luSet]}）</h3>${sd.serve.length?`<div>${sd.serve.map((id,i)=>{ const pos=POS_ORDER.find(p=>sd.pos[p]===id); return `<div class="player"><span class="num" style="background:var(--ink);color:var(--bg)">${i+1}</span><div class="nm"><b>${esc(pnum(id))}　${esc(pname(id))}</b><span class="muted">${pos?esc(POS[pos].name):""}</span></div>${D.canWrite?`<button class="icon-btn" data-svmove="${i}:-1" aria-label="${i+1}番を上へ" ${i===0?"disabled":""}>↑</button><button class="icon-btn" data-svmove="${i}:1" aria-label="${i+1}番を下へ" ${i===sd.serve.length-1?"disabled":""}>↓</button>`:""}</div>`; }).join("")}</div>`:`<p class="muted">コートに選手を入れると、ここにサーブ順が並びます。</p>`}</div>`;
  const bench=D.roster.filter(p=>!Object.values(sd.pos).includes(p.id)&&(!S.regOnly||p.reg)).sort((a,b)=>(+a.num||9999)-(+b.num||9999));
  if(bench.length) h+=`<div class="card"><h3>ベンチ</h3><div class="chips">${bench.map(p=>`<span class="chip">${esc(p.num??"")} ${esc(p.name)}</span>`).join("")}</div></div>`;
  if(D.canWrite) h+=`<button class="btn warn" data-del-l="${esc(l.id)}">このオーダー表を削除</button>`;
  return h;
}
const STANDALONE = !/claude|anthropic/.test(location.hostname) && location.protocol.startsWith("http");
function exportJSON(){ return JSON.stringify({app:"team-volley-book",version:1,exported:new Date().toISOString(),roster:D.roster,events:D.events,lineups:D.lineups}); }
function dataCard(){
  return `<details class="card" id="xfer" ${S.xferOpen?"open":""}><summary style="cursor:pointer;font-weight:700">データの受け渡し</summary>
  <p class="muted">名簿・オーダー・大会予定を1つのファイルにまとめて、別の端末やメンバーに渡せます。</p>
  <div class="row"><button class="btn sub" data-export="file">ファイルに書き出す</button><button class="btn sub" data-export="copy">文字でコピー</button></div>
  ${S.xferMsg?`<p class="muted" role="status">${esc(S.xferMsg)}</p>`:""}
  ${D.canWrite?`<label class="f">ファイルから読み込む<input type="file" id="ximport" accept="application/json,.json,.txt"></label>
  <label class="f">または、コピーした文字を貼り付けて読み込む<textarea id="xpaste" placeholder='{"app":"team-volley-book", ...}'></textarea></label>
  <div class="row"><button class="btn" data-import="paste">貼り付けた内容を読み込む</button></div>
  <p class="why">読み込むと、同じ選手・予定・オーダーは上書きされ、新しいものは追加されます。今のデータは消えません。</p>`:""}</details>`;
}
async function importData(text){
  let obj; try{ obj=JSON.parse(text); }catch(e){ S.xferMsg="読み込めませんでした。ファイルの中身が正しくありません。"; return render(); }
  if(!obj||obj.app!=="team-volley-book"){ S.xferMsg="チームバレー帳のデータではないようです。"; return render(); }
  let n=0;
  for(const col of ["roster","events","lineups"]){
    for(const it of (Array.isArray(obj[col])?obj[col]:[])){
      if(!it||typeof it!=="object") continue;
      const {id,...body}=it; const safeId = typeof id==="string"&&/^[A-Za-z0-9_\-.~:@+]{1,100}$/.test(id)&&id!=="."&&id!==".." ? id : null;
      if(D.mode!=="db"&&safeId){ const arr=D[col]; const i=arr.findIndex(x=>x.id===safeId); if(i>=0) arr[i]={id:safeId,...body}; else arr.push({id:safeId,...body}); LS.set("vb-"+col,arr); n++; }
      else { const r=await save(col,safeId,body); if(r) n++; }
    }
  }
  S.xferMsg=`${n}件を読み込みました。`; S.xferOpen=true; freshRender();
}
function posLabel(k){ const o=POS_OPTS.find(x=>x[0]===k); return o?o[1]:"未定"; }
function viewTeam(){
  let h = `<div class="seg" role="group" aria-label="表示"><button data-teamsub="roster" aria-pressed="${S.teamSub==="roster"}">名簿</button><button data-teamsub="lineup" aria-pressed="${S.teamSub==="lineup"}">オーダー</button><button data-teamsub="events" aria-pressed="${S.teamSub==="events"}">大会予定</button></div>`;
  if(D.mode==="loading") return h+`<p class="muted">読み込み中…</p>`;
  if(D.mode==="local") h += `<p class="note">データはこの端末に保存されます。メンバーと同じ内容にするには、下の「データの受け渡し」でファイルを送って読み込んでもらいます。</p>`;
  if(D.note) h += `<p class="note">${esc(D.note)}</p>`;
  if(D.err) h += `<p class="err" role="alert">${esc(D.err)}</p>`;
  if(!D.canWrite) h += `<p class="note">閲覧のみです。編集はキャプテンが共有設定で「参加者」以上にした人ができます。</p>`;
  if(S.teamSub==="lineup") return h+viewLineups()+dataCard();
  if(S.teamSub==="roster"){
    const list=[...D.roster].sort((a,b)=>(+a.num||999)-(+b.num||999));
    const reg=list.filter(p=>p.reg).length;
    h += `<div class="card"><div class="row" style="justify-content:space-between"><h3>名簿</h3><span class="muted">${list.length}人・選手登録 ${reg}人</span></div>`;
    h += list.length ? `<div>${list.map(p=>`<div class="player"><span class="num">${esc(p.num??"-")}</span><div class="nm"><b>${esc(p.name)}</b><span class="muted">${esc(posLabel(p.pos))}</span></div><span class="tag" style="--c:${p.reg?'var(--def)':'var(--muted)'};--tbg:${p.reg?'var(--def-bg)':'var(--court)'}">${p.reg?"登録済":"未登録"}</span>${D.canWrite?`<button class="icon-btn" data-edit-r="${esc(p.id)}">編集</button>`:""}</div>`).join("")}</div>` : `<p class="muted">まだ誰も登録されていません。下のフォームから追加してください。</p>`;
    h += `</div>`;
    if(D.canWrite){
      const e = S.editR?D.roster.find(x=>x.id===S.editR):null;
      const taken = new Set(D.roster.filter(x=>x.id!==S.editR).map(x=>String(x.num??"")));
      h += `<form class="card" id="fr"><h3>${e?"選手を編集":"選手を追加"}</h3><p class="why">名前以外の個人情報（連絡先・住所など）は入れないでください。</p>
      <div class="grid3"><label class="f">背番号<input type="text" id="rnum" maxlength="3" inputmode="numeric" pattern="[0-9]*" value="${e?esc(e.num):""}" required></label><label class="f">名前<input type="text" id="rname" maxlength="20" value="${e?esc(e.name):""}" required></label></div>
      <div class="grid2"><label class="f">ポジション<select id="rpos">${POS_OPTS.map(([k,l])=>`<option value="${k}" ${e&&e.pos===k?"selected":""}>${l}</option>`).join("")}</select></label><label class="check" style="align-self:end;padding-bottom:8px"><input type="checkbox" id="rreg" ${e&&e.reg?"checked":""}><span>選手登録済み</span></label></div>
      <p class="err" id="rerr" role="alert"></p>
      <div class="row"><button class="btn" type="submit">${e?"更新する":"追加する"}</button>${e?`<button class="btn sub" type="button" data-cancel="r">やめる</button><button class="btn warn" type="button" data-del-r="${esc(e.id)}">削除</button>`:""}</div></form>`;
      h += `<script type="text/plain" id="taken">${[...taken].join(",")}<\/script>`;
    }
  } else {
    const up=upcoming(), ps=past();
    h += countdown();
    h += `<div class="card"><h3>これからの予定</h3>${up.length?`<div>${up.map(e=>evRow(e,true)).join("")}</div>`:`<p class="muted">予定はまだありません。年間の大会やエントリー締切を追加してください。</p>`}</div>`;
    if(ps.length) h += `<button class="list-btn" data-past="1"><span><b>終わった予定</b> <small>${ps.length}件</small></span><span class="arrow">${S.showPast?"−":"＋"}</span></button>${S.showPast?`<div class="card"><div>${ps.map(e=>evRow(e,true)).join("")}</div></div>`:""}`;
    if(D.canWrite){
      const e = S.editE?D.events.find(x=>x.id===S.editE):null;
      h += `<form class="card" id="fe"><h3>${e?"予定を編集":"予定を追加"}</h3>
      <div class="grid2"><label class="f">開始日<input type="date" id="edate" value="${e?esc(e.date):""}" required></label><label class="f">最終日（複数日のとき）<input type="date" id="eend" value="${e?esc(e.end):""}"></label></div>
      <label class="f">種類<select id="ekind">${EV_KINDS.map(k=>`<option ${e&&e.kind===k?"selected":""}>${k}</option>`).join("")}</select></label>
      <label class="f">名前<input type="text" id="ename" maxlength="40" placeholder="例：市民大会 9人制の部" value="${e?esc(e.name):""}" required></label>
      <div class="grid2"><label class="f">会場<input type="text" id="eplace" maxlength="30" value="${e?esc(e.place):""}"></label><label class="f">エントリー締切<input type="date" id="edl" value="${e?esc(e.deadline):""}"></label></div>
      <label class="f">メモ（ローカルルールなど）<input type="text" id="ememo" maxlength="60" placeholder="例：サーブ1本、15点2セット先取" value="${e?esc(e.memo):""}"></label>
      <p class="err" id="eerr" role="alert"></p>
      <div class="row"><button class="btn" type="submit">${e?"更新する":"追加する"}</button>${e?`<button class="btn sub" type="button" data-cancel="e">やめる</button><button class="btn warn" type="button" data-del-e="${esc(e.id)}">削除</button>`:""}</div></form>`;
    }
  }
  return h+dataCard();
}

/* ---------- render & events ---------- */
function render(){
  const ae=document.activeElement; const fid=ae&&ae.id&&ae.closest&&ae.closest("form")?ae.id:null; let keep={};
  document.querySelectorAll("form input,form select").forEach(i=>{ keep[i.id]= i.type==="checkbox"?i.checked:i.value; });
  const v = {home:viewHome,tactics:viewTactics,skills:viewSkills,practice:viewPractice,team:viewTeam}[S.tab]();
  $("#app").innerHTML = `<div class="view">${v}</div>`;
  if(!render.reset){ Object.entries(keep).forEach(([id,val])=>{ const el=document.getElementById(id); if(el){ if(el.type==="checkbox") el.checked=val; else el.value=val; } }); if(fid){ const el=document.getElementById(fid); if(el) el.focus(); } }
  render.reset=false;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===S.tab?"page":"false"));
  $("#who").textContent = S.mine ? POS[S.mine].name : "";
  const q=$("#q"); if(q) q.addEventListener("input",e=>{ S.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); });
  const p=$("#ppl"); if(p) p.addEventListener("change",e=>{ const n=Math.round(+e.target.value); S.ppl=Math.min(40,Math.max(1,isFinite(n)&&n>0?n:S.ppl)); render(); });
}
function freshRender(){ render.reset=true; render(); }
document.addEventListener("click",e=>{
  const t = e.target.closest("[data-tab],[data-tsub],[data-form],[data-pos],[data-skill],[data-target],[data-mine],[data-theme],[data-done],[data-ppl],[data-spin],[data-kiso],[data-teamsub],[data-edit-r],[data-edit-e],[data-cancel],[data-del-r],[data-del-e],[data-past],[data-men],[data-lu],[data-luset],[data-lupos],[data-assign],[data-unassign],[data-svmove],[data-copyset],[data-luback],[data-del-l],[data-regonly],[data-export],[data-import]");
  if(!t) return;
  const d = t.dataset;
  if(d.done!==undefined){ S.done[d.done]=t.checked; return; }
  if(d.tab){ S.tab=d.tab; S.skill=null; S.target=null; if(d.teamsub) S.teamSub=d.teamsub; if(d.kiso) S.kiso=d.kiso; window.scrollTo(0,0); return freshRender(); }
  if(d.tsub) S.tsub=d.tsub;
  else if(d.form){ S.form=d.form; if(S.sel && !FORM[S.form].pts[S.sel]) S.sel=null; }
  else if(d.pos) S.sel = S.sel===d.pos?null:d.pos;
  else if(d.target) S.target = S.target===+d.target?null:+d.target;
  else if(d.skill!==undefined){ S.tab="skills"; S.skill=d.skill||null; S.target=null; window.scrollTo(0,0); }
  else if(d.mine){ S.mine = S.mine===d.mine?null:d.mine; try{ S.mine?localStorage.setItem("vb-mine",S.mine):localStorage.removeItem("vb-mine"); }catch(err){} }
  else if(d.theme){ S.theme=d.theme; S.picked=null; S.men=null; }
  else if(d.ppl){ S.ppl=Math.min(40,Math.max(1,S.ppl+(+d.ppl))); }
  else if(d.kiso) S.kiso=d.kiso;
  else if(d.spin){ return spin(); }
  else if(d.teamsub){ S.teamSub=d.teamsub; S.editR=S.editE=null; D.err=""; return freshRender(); }
  else if(d.editR){ S.editR=d.editR; freshRender(); document.getElementById("fr")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  else if(d.editE){ S.editE=d.editE; freshRender(); document.getElementById("fe")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  else if(d.cancel){ if(d.cancel==="r") S.editR=null; else S.editE=null; return freshRender(); }
  else if(d.delR){ askDelete("roster",d.delR,t); return; }
  else if(d.delE){ askDelete("events",d.delE,t); return; }
  else if(d.past) S.showPast=!S.showPast;
  else if(d.men) S.men=d.men;
  else if(d.lu){ S.luId=d.lu; S.luSet="s1"; S.luPos=null; window.scrollTo(0,0); }
  else if(d.luback){ S.luId=null; S.luPos=null; }
  else if(d.luset){ S.luSet=d.luset; S.luPos=null; }
  else if(d.lupos){ S.luPos = S.luPos===d.lupos?null:d.lupos; render(); if(S.luPos) document.getElementById("picker")?.scrollIntoView({behavior:"smooth",block:"nearest"}); return; }
  else if(d.regonly!==undefined){ S.regOnly=t.checked; }
  else if(d.assign){ const sd=setData(lu(),S.luSet); POS_ORDER.forEach(p=>{ if(sd.pos[p]===d.assign) delete sd.pos[p]; }); sd.pos[S.luPos]=d.assign; S.luPos=null; return writeSet(S.luSet,sd); }
  else if(d.unassign){ const sd=setData(lu(),S.luSet); delete sd.pos[S.luPos]; S.luPos=null; return writeSet(S.luSet,sd); }
  else if(d.svmove){ const [i,dir]=d.svmove.split(":").map(Number); const sd=syncServe(setData(lu(),S.luSet)); const j=i+dir; if(j<0||j>=sd.serve.length) return; [sd.serve[i],sd.serve[j]]=[sd.serve[j],sd.serve[i]]; return writeSet(S.luSet,sd); }
  else if(d.copyset){ const prev=SETS[SETS.indexOf(S.luSet)-1]; return writeSet(S.luSet,setData(lu(),prev)); }
  else if(d.delL){ askDelete("lineups",d.delL,t); return; }
  else if(d.export){ S.xferOpen=true; const txt=exportJSON();
    if(d.export==="copy"){ (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{S.xferMsg="コピーしました。LINEなどに貼り付けて送れます。";render();}).catch(()=>{S.xferMsg="コピーできませんでした。";render();}); return; }
    try{ const a=document.createElement("a"); const day=new Date().toISOString().slice(0,10); a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"})); a.download=`volley-book-${day}.json`; document.body.appendChild(a); a.click(); a.remove(); S.xferMsg=STANDALONE?"ファイルを書き出しました。":"この画面ではファイルを保存できない場合があります。うまくいかなければ「文字でコピー」を使ってください。"; }catch(err){ S.xferMsg="書き出せませんでした。「文字でコピー」を使ってください。"; }
  }
  else if(d.import){ const v=$("#xpaste").value.trim(); if(!v){ S.xferMsg="貼り付け欄が空です。"; S.xferOpen=true; } else { importData(v); return; } }
  render();
});
function askDelete(col,id,btn){
  if(btn.dataset.armed){ remove(col,id).then(()=>{ if(col==="roster") S.editR=null; else if(col==="events") S.editE=null; else S.luId=null; freshRender(); }); return; }
  btn.dataset.armed="1"; btn.textContent="もう一度押すと削除"; setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent="削除"; } },4000);
}
function spin(){
  if(S.spinning) return;
  const keys=Object.keys(THEMES), n=keys.length, i=Math.floor(Math.random()*n), seg=360/n;
  const target = 360 - (i*seg + seg/2);
  const base = S.rot - (S.rot % 360);
  const next = base + 360*5 + target + (Math.random()-.5)*seg*.6;
  S.spinning=true; S.picked=null; render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const w=document.getElementById("wheel"); if(w) w.style.transform=`rotate(${next}deg)`; S.rot=next; }));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{ S.spinning=false; S.picked=keys[i]; S.theme=keys[i]; S.men=null; render(); }, reduce?50:3300);
}
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="fr"){
    const num=$("#rnum").value.trim(), name=$("#rname").value.trim(), err=$("#rerr");
    if(num===""||!/^\d{1,3}$/.test(num)){ err.textContent="背番号を3桁までの数字で入れてください。"; return; }
    if(!name){ err.textContent="名前を入れてください。"; return; }
    const taken=(document.getElementById("taken")?.textContent||"").split(",");
    if(taken.includes(num)){ err.textContent=`背番号${num}はすでに使われています。`; return; }
    const ok = await save("roster",S.editR,{num:num,name,pos:$("#rpos").value,reg:$("#rreg").checked});
    if(ok){ S.editR=null; freshRender(); }
  }
  if(e.target.id==="fl"){
    const name=$("#lname").value.trim(); if(!name){ $("#lerr").textContent="オーダー表の名前を入れてください。"; return; }
    const id = await save("lineups",null,{name,date:$("#ldate").value,sets:{}});
    if(id){ S.luId=id; S.luSet="s1"; S.luPos=null; freshRender(); window.scrollTo(0,0); }
  }
  if(e.target.id==="fe"){
    const date=$("#edate").value, name=$("#ename").value.trim(), err=$("#eerr");
    if(!date){ err.textContent="日付を選んでください。"; return; }
    if(!name){ err.textContent="予定の名前を入れてください。"; return; }
    const end=$("#eend").value;
    if(end&&end<date){ err.textContent="最終日は開始日より後の日付にしてください。"; return; }
    const ok = await save("events",S.editE,{date,end:end&&end>date?end:"",kind:$("#ekind").value,name,place:$("#eplace").value.trim(),deadline:$("#edl").value,memo:$("#ememo").value.trim()});
    if(ok){ S.editE=null; freshRender(); }
  }
});
document.addEventListener("change",e=>{ if(e.target.id==="ximport"&&e.target.files[0]){ const f=e.target.files[0]; f.text().then(importData); } });
document.addEventListener("toggle",e=>{ if(e.target.id==="xfer") S.xferOpen=e.target.open; },true);
document.addEventListener("input",e=>{ if(e.target.closest("form")){ const er=e.target.closest("form").querySelector(".err"); if(er) er.textContent=""; } });
document.addEventListener("keydown",e=>{ const g=e.target.closest&&e.target.closest("[data-pos],[data-target],[data-lupos]"); if(g&&g.tagName!=="BUTTON"&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); g.dispatchEvent(new MouseEvent("click",{bubbles:true})); }});
render();
initData();
if(STANDALONE && "serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
